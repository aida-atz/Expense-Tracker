openapi: 3.0.3

info:
  title: Expense Tracker API
  version: 1.0.0
  description: |
    JSON REST API for user authentication, income and expense categories,
    transactions, and financial reporting.

    All transaction and category operations use a Bearer JWT, except registration
    and login. Amounts in responses are represented as decimal strings to
    preserve monetary precision. All date-filter boundaries use UTC.

    Implementation alignment note: This specification is based on the API
    contract developed so far. Verify the exact shapes of category mutations,
    register/login responses, transaction updates, delete response status codes,
    and shared error envelopes against the current Express controllers before
    treating this as a frozen public contract.

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Authentication
    description: Registration and login
  - name: Categories
    description: Built-in and user-owned transaction categories
  - name: Transactions
    description: CRUD, pagination, filtering, sorting, and search
  - name: Reports
    description: Financial summaries and monthly reports

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: alice@example.com
              password: StrongPassword123!
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                status: success
                data:
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: alice@example.com
                    createdAt: "2026-11-27T12:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Log in to an existing account
      description: Returns a one-hour HS256 JWT access token on successful authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: alice@example.com
              password: StrongPassword123!
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                status: success
                data:
                  user:
                    id: 11111111-1111-4111-8111-111111111111
                    email: alice@example.com
                  accessToken: "<signed-jwt-token>"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List available categories
      description: Returns built-in default categories and categories owned by the authenticated user.
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriesResponse"
              example:
                status: success
                data:
                  categories:
                    - id: 22222222-2222-4222-8222-222222222222
                      name: Food
                      type: EXPENSE
                      isDefault: true
                      isArchived: false
                      userId: null
                      createdAt: "2026-11-01T10:00:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Categories]
      operationId: createCategory
      summary: Create a custom category
      description: The category is owned by the authenticated user, not a global default.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreateRequest"
            example:
              name: Subscriptions
              type: EXPENSE
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
              example:
                status: success
                data:
                  category:
                    id: 33333333-3333-4333-8333-333333333333
                    name: Subscriptions
                    type: EXPENSE
                    isDefault: false
                    isArchived: false
                    userId: 11111111-1111-4111-8111-111111111111
                    createdAt: "2026-11-27T12:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /categories/{id}:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    patch:
      tags: [Categories]
      operationId: updateCategory
      summary: Edit a user-owned category
      description: |
        Built-in default categories cannot be edited. Verify which custom-category
        fields your current validator permits before publishing this contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateRequest"
            example:
              name: Streaming services
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Categories]
      operationId: archiveCategory
      summary: Archive a custom category
      description: |
        Soft-delete: sets isArchived to true rather than deleting the database
        row. Historical transactions keep their category relation. Global
        default categories cannot be archived. Verify whether the live
        controller responds with 200 JSON or 204 No Content.
      responses:
        "200":
          description: Category archived, if the controller returns the updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "204":
          description: Category archived successfully with no response body (alternate implementation)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /transactions:
    get:
      tags: [Transactions]
      operationId: listTransactions
      summary: List the authenticated user's transactions
      description: |
        Applies optional filters before counting and pagination. Date-only
        parameters use UTC day boundaries; endDate includes the full specified
        day. Results are sorted by the chosen field with id as a stable tie-breaker.
      parameters:
        - $ref: "#/components/parameters/TransactionType"
        - $ref: "#/components/parameters/TransactionCategoryId"
        - $ref: "#/components/parameters/StartDate"
        - $ref: "#/components/parameters/EndDate"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/SortBy"
        - $ref: "#/components/parameters/SortOrder"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Paginated transactions and metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionsListResponse"
              example:
                status: success
                data:
                  transactions:
                    - id: 44444444-4444-4444-8444-444444444444
                      amount: "91.05"
                      description: Groceries
                      categoryId: 22222222-2222-4222-8222-222222222222
                      userId: 11111111-1111-4111-8111-111111111111
                      createdAt: "2026-11-25T14:00:00.000Z"
                  pagination:
                    page: 1
                    limit: 10
                    total: 1
                    totalPages: 1
                    hasNextPage: false
                    hasPreviousPage: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Create a transaction
      description: |
        The chosen category must exist, be accessible to the current user,
        be active, and agree with the requested INCOME/EXPENSE type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreateRequest"
            example:
              amount: "91.05"
              type: EXPENSE
              categoryId: 22222222-2222-4222-8222-222222222222
              description: Groceries
      responses:
        "201":
          description: Transaction created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
              example:
                status: success
                data:
                  transaction:
                    id: 44444444-4444-4444-8444-444444444444
                    amount: "91.05"
                    description: Groceries
                    categoryId: 22222222-2222-4222-8222-222222222222
                    userId: 11111111-1111-4111-8111-111111111111
                    createdAt: "2026-11-25T14:00:00.000Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /transactions/summary:
    get:
      tags: [Reports]
      operationId: getFinancialSummary
      summary: Get all-time income, expenses, and balance
      description: |
        Summary is for the authenticated user across all transactions.
        Returns decimal strings, including zeros when no matching records exist.
        The schema below uses the later flat `data` response shape.
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummaryResponse"
              example:
                status: success
                data:
                  totalIncome: "0.00"
                  totalExpense: "91.05"
                  balance: "-91.05"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /transactions/reports/monthly:
    get:
      tags: [Reports]
      operationId: getYearlyMonthlyReport
      summary: Get a twelve-month financial report
      description: |
        Returns the income, expense, and balance for each month of a given year.
        All 12 months are included, even those with no transactions. Month
        boundaries are UTC and income/expense amounts are decimal strings.
      parameters:
        - $ref: "#/components/parameters/ReportYear"
      responses:
        "200":
          description: Full-year report grouped by month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YearlyReportResponse"
              example:
                status: success
                data:
                  year: 2026
                  months:
                    - month: 1
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 2
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 3
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 4
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 5
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 6
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 7
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 8
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 9
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 10
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
                    - month: 11
                      income: "0.00"
                      expense: "91.05"
                      balance: "-91.05"
                    - month: 12
                      income: "0.00"
                      expense: "0.00"
                      balance: "0.00"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  /transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/TransactionId"
    get:
      tags: [Transactions]
      operationId: getTransaction
      summary: Get a single user-owned transaction
      responses:
        "200":
          description: Transaction found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Transactions]
      operationId: updateTransaction
      summary: Update one or more transaction fields
      description: Only transactions owned by the authenticated user can be updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionUpdateRequest"
            example:
              amount: "95.25"
              description: Updated groceries
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Transactions]
      operationId: deleteTransaction
      summary: Delete a user-owned transaction
      description: |
        Deletes a transaction (unlike category deletion, which archives).
        Confirm whether the current controller sends 204 with no body or a
        200 response envelope; both are shown pending verification.
      responses:
        "200":
          description: Transaction deleted with JSON confirmation (alternate implementation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "204":
          description: Transaction deleted successfully; no response body
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token returned by POST /auth/login (Authorization: Bearer <token>)."

  parameters:
    CategoryId:
      name: id
      in: path
      required: true
      description: Category UUID
      schema:
        type: string
        format: uuid
      example: 22222222-2222-4222-8222-222222222222
    TransactionId:
      name: id
      in: path
      required: true
      description: Transaction UUID
      schema:
        type: string
        format: uuid
      example: 44444444-4444-4444-8444-444444444444
    TransactionType:
      name: type
      in: query
      description: Transaction type, derived from the related category
      schema:
        $ref: "#/components/schemas/TransactionType"
    TransactionCategoryId:
      name: categoryId
      in: query
      description: Filter by category UUID
      schema:
        type: string
        format: uuid
    StartDate:
      name: startDate
      in: query
      description: "Inclusive start date (YYYY-MM-DD, UTC)."
      schema:
        type: string
        format: date
      example: "2026-11-01"
    EndDate:
      name: endDate
      in: query
      description: "Inclusive end date (YYYY-MM-DD, UTC); must not precede startDate."
      schema:
        type: string
        format: date
      example: "2026-11-30"
    Search:
      name: search
      in: query
      description: Case-insensitive substring search in the description; leading/trailing whitespace is trimmed
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: coffee
    SortBy:
      name: sortBy
      in: query
      description: Field to sort by
      schema:
        type: string
        enum: [createdAt, amount]
        default: createdAt
    SortOrder:
      name: sortOrder
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    Page:
      name: page
      in: query
      description: One-based page number
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Maximum number of transactions per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    ReportYear:
      name: year
      in: query
      required: true
      description: Year to report, including future years within range
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
      example: 2026

  schemas:
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]

    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Monetary value serialized as a decimal string with two fractional digits
      example: "91.05"

    MoneyInput:
      description: Positive monetary amount; the API's express-validator accepts numeric strings or numbers
      oneOf:
        - type: string
          pattern: '^\d{1,10}(\.\d{1,2})?$'
        - type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 9999999999.99
      example: "91.05"

    PublicUser:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
          description: Present if included by the controller's safe user projection
      additionalProperties: false

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 1
      additionalProperties: false

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      additionalProperties: false

    RegisterResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [user]
          properties:
            user:
              $ref: "#/components/schemas/PublicUser"

    LoginResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [user, accessToken]
          properties:
            user:
              $ref: "#/components/schemas/PublicUser"
            accessToken:
              type: string
              description: Signed JWT; expires one hour after issuance

    Category:
      type: object
      required: [id, name, type, isDefault, isArchived]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/TransactionType"
        isDefault:
          type: boolean
        isArchived:
          type: boolean
        userId:
          type: string
          format: uuid
          nullable: true
          description: Null for global default categories
        createdAt:
          type: string
          format: date-time

    CategoryCreateRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          example: Subscriptions
        type:
          $ref: "#/components/schemas/TransactionType"
      additionalProperties: false

    CategoryUpdateRequest:
      type: object
      minProperties: 1
      description: Confirm editable fields against the actual PATCH validator; name is shown here
      properties:
        name:
          type: string
          minLength: 1
          example: Streaming services
      additionalProperties: false

    CategoriesResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [categories]
          properties:
            categories:
              type: array
              items:
                $ref: "#/components/schemas/Category"

    CategoryResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [category]
          properties:
            category:
              $ref: "#/components/schemas/Category"

    Transaction:
      type: object
      required: [id, amount, categoryId, userId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        amount:
          $ref: "#/components/schemas/Money"
        description:
          type: string
          nullable: true
          maxLength: 500
        categoryId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        category:
          description: Included only if the query selects the category relation
          $ref: "#/components/schemas/Category"

    TransactionCreateRequest:
      type: object
      required: [amount, type, categoryId]
      properties:
        amount:
          $ref: "#/components/schemas/MoneyInput"
        type:
          $ref: "#/components/schemas/TransactionType"
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 500
      additionalProperties: false

    TransactionUpdateRequest:
      type: object
      minProperties: 1
      properties:
        amount:
          $ref: "#/components/schemas/MoneyInput"
        type:
          description: Request-level type; the persisted transaction type is derived from category
          $ref: "#/components/schemas/TransactionType"
        categoryId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 500
      additionalProperties: false

    TransactionResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [transaction]
          properties:
            transaction:
              $ref: "#/components/schemas/Transaction"

    Pagination:
      type: object
      required: [page, limit, total, totalPages, hasNextPage, hasPreviousPage]
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean

    TransactionsListResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [transactions, pagination]
          properties:
            transactions:
              type: array
              items:
                $ref: "#/components/schemas/Transaction"
            pagination:
              $ref: "#/components/schemas/Pagination"

    FinancialSummary:
      type: object
      required: [totalIncome, totalExpense, balance]
      properties:
        totalIncome:
          $ref: "#/components/schemas/Money"
        totalExpense:
          $ref: "#/components/schemas/Money"
        balance:
          $ref: "#/components/schemas/Money"

    FinancialSummaryResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: "#/components/schemas/FinancialSummary"

    MonthlyReport:
      type: object
      required: [month, income, expense, balance]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        income:
          $ref: "#/components/schemas/Money"
        expense:
          $ref: "#/components/schemas/Money"
        balance:
          $ref: "#/components/schemas/Money"

    YearlyReportResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [year, months]
          properties:
            year:
              type: integer
              minimum: 2000
              maximum: 2100
            months:
              type: array
              minItems: 12
              maxItems: 12
              items:
                $ref: "#/components/schemas/MonthlyReport"

    SuccessMessageResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string
          example: Transaction deleted successfully

    ErrorResponse:
      type: object
      required: [status]
      description: |
        Shared error envelope. Error controllers may include a message or
        additional validation details. Confirm the final response shape.
      properties:
        status:
          type: string
          enum: [fail, error]
          example: fail
        message:
          type: string
          example: Invalid request
        errors:
          type: array
          description: Optional structured field validation errors, if enabled by the controller
          items:
            type: object
            additionalProperties: true

  responses:
    BadRequest:
      description: Validation failed or malformed input (400)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: fail
            message: Invalid request
    Unauthorized:
      description: Authentication required, invalid credentials, or invalid/expired JWT (401)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: fail
            message: Authentication required
    Forbidden:
      description: Operation not permitted for this category or resource (403)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: fail
            message: This operation is not allowed
    NotFound:
      description: Resource not found or not accessible to the authenticated user (404)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: fail
            message: Resource not found
    Conflict:
      description: Resource conflict, such as duplicate email or unique constraint (409)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: fail
            message: Resource already exists
    RateLimited:
      description: Rate limit exceeded (429); Retry-After may indicate when to retry
      headers:
        Retry-After:
          description: Suggested time to wait, in seconds
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: fail
            message: API rate limit exceeded. Please try again later.
    InternalError:
      description: Unexpected server error (500)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            status: error
            message: Internal server error
